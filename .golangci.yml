version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
        - name: receiver-naming
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
        - name: indent-error-flow
        - name: unexported-return
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
