name: release-please

# Automates version bumps, CHANGELOG.md updates, and vX.Y.Z GitHub releases
# from Conventional Commits on main. Merging a release PR creates the vX.Y.Z
# tag that triggers release.yml (GoReleaser).
#
# NOTE: Uses secrets.RELEASE_TOKEN (a fine-grained PAT) rather than the default
# GITHUB_TOKEN so tags created by release-please trigger release.yml.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
